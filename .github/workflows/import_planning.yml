name: Import planning

on:
  repository_dispatch:
    types:
      - import_planning

  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-import:
    runs-on: ubuntu-latest

    steps:

      - name: Vérifier le workflow
        run: |
          echo "======================================"
          echo "✓ GitHub Actions fonctionne"
          echo "======================================"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch : $GITHUB_REF"
          echo "Commit : $GITHUB_SHA"

      - name: Afficher les informations reçues
        env:
          VERSION: ${{ github.event.client_payload.version }}
          PLANNING_BASE64: ${{ github.event.client_payload.planning }}
        run: |
          echo "======================================"
          echo "DONNEES RECUES"
          echo "======================================"
          echo "Version : $VERSION"
          echo "Taille Base64 : ${#PLANNING_BASE64} caractères"
          echo "======================================"

      - name: Vérifier si un planning a été reçu
        env:
          PLANNING_BASE64: ${{ github.event.client_payload.planning }}
        run: |

          if [ -z "$PLANNING_BASE64" ]; then
            echo "Mode test manuel."
            echo "Aucun planning reçu."
            exit 0
          fi

          echo "$PLANNING_BASE64" | base64 --decode | gzip -d > planning_test.json

          echo "Planning décompressé avec succès."
          echo "Taille : $(wc -c < planning_test.json) octets"

      - name: Test terminé
        run: |
          echo "======================================"
          echo "✓ TEST TERMINE"
          echo "======================================"
          echo "Aucun fichier du dépôt n'a été modifié."
